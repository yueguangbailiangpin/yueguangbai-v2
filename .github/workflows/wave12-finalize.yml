name: Wave 12 finalize schema guards

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wave12-profit-financial-reporting
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Patch remaining legacy schema guards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets = [
            Path('apps/api/src/buyer-order-evidence-portal/buyer-order-evidence-portal.test.ts'),
            Path('apps/api/src/buyer-portal/buyer-portal.test.ts'),
            Path('apps/api/src/reviews/review-workflow.test.ts'),
            Path('apps/api/src/seller-formal-orders/seller-formal-orders.test.ts'),
            Path('apps/api/src/seller-portal/seller-portal.test.ts'),
          ]
          replacements = {
            'schema_version: 24': 'schema_version: 26',
            'toHaveLength(24)': 'toHaveLength(26)',
            "toBe('0024_seller_payments_allocations.sql')": "toBe('0026_financial_export_audit.sql')",
            'toMatch(/^0024_/u)': "toBe('0026_financial_export_audit.sql')",
            'through 0024': 'through 0026',
            'schema24': 'schema26',
            'schema 24': 'schema 26',
          }
          changed = 0
          for path in targets:
            original = path.read_text()
            text = original
            for old, new in replacements.items():
              text = text.replace(old, new)
            if text != original:
              path.write_text(text)
              changed += 1
          if changed != len(targets):
            raise SystemExit(f'expected {len(targets)} changed files, got {changed}')
          residual = []
          for path in targets:
            text = path.read_text()
            for token in replacements:
              if token in text:
                residual.append(f'{path}:{token}')
          if residual:
            raise SystemExit('residual legacy guards: ' + ', '.join(residual))
          PY
      - name: Install and verify
        run: |
          npm ci
          npm run typecheck
          npm run verify:wave12
          npm test -- --runInBand
      - name: Commit exact guard updates and remove workflow
        if: success()
        shell: bash
        run: |
          rm .github/workflows/wave12-finalize.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src .github/workflows/wave12-finalize.yml
          git commit -m 'test: finalize wave12 schema 26 regression guards'
          git push origin HEAD:feature/wave12-profit-financial-reporting
